name: GitHub City
description: Рисует изометрический город из ваших репозиториев для README профиля. Высота дома — число коммитов.
author: codebywater
branding:
  icon: home
  color: blue

inputs:
  user:
    description: Пользователь GitHub. По умолчанию — владелец репозитория.
    default: ${{ github.repository_owner }}
  out:
    description: Папка для city-light.svg и city-dark.svg.
    default: assets
  exclude:
    description: Репозитории, которые не нужно показывать, через запятую.
    default: ""
  forks:
    description: Показывать форки (true/false).
    default: "false"
  max-repos:
    description: Сколько домов рисовать — самые большие по коммитам. 0 — без ограничения.
    default: "36"
  commit:
    description: Закоммитить картинки, если они изменились (true/false).
    default: "true"
  token:
    description: Токен для GitHub API.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Draw the city
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CITY_USER: ${{ inputs.user }}
        CITY_OUT: ${{ inputs.out }}
        CITY_EXCLUDE: ${{ inputs.exclude }}
        CITY_FORKS: ${{ inputs.forks }}
        CITY_MAX: ${{ inputs.max-repos }}
        # Репозиторий, куда коммитится картинка, в город не попадает: иначе каждый
        # коммит «Update GitHub City» менял бы картинку и коммиты шли бы каждый день.
        CITY_HOST: ${{ github.repository }}
      run: |
        args=("$CITY_USER" --out "$CITY_OUT" --host "$CITY_HOST")
        # Пустое max-repos — значение по умолчанию, а не «без ограничения».
        [ -n "$CITY_MAX" ] && args+=(--max "$CITY_MAX")
        [ -n "$CITY_EXCLUDE" ] && args+=(--exclude "$CITY_EXCLUDE")
        [ "$CITY_FORKS" = "true" ] && args+=(--forks)
        node "$GITHUB_ACTION_PATH/src/cli.js" "${args[@]}"
    - name: Commit
      if: inputs.commit == 'true'
      shell: bash
      env:
        CITY_OUT: ${{ inputs.out }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "$CITY_OUT"/city-*.svg
        if git diff --cached --quiet; then
          echo "Город не изменился."
          # GitHub отключает расписание в публичном репозитории после 60 дней без активности.
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          days=$(( ($(date +%s) - last) / 86400 ))
          if [ "$days" -ge 50 ]; then
            echo "::warning title=GitHub City::В репозитории нет коммитов уже $days дн. После 60 дней GitHub отключит запуск по расписанию. Сделайте любой коммит, а если расписание уже отключено — Actions → GitHub City → Enable workflow."
          fi
          exit 0
        fi
        git commit -m "Update GitHub City"
        # Пока шёл запуск, в ветку могли запушить (правка README, параллельный запуск).
        # Подтягиваем и пробуем снова; при конфликте в картинках берём только что нарисованные.
        branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
        for attempt in 1 2 3; do
          git push origin "HEAD:$branch" && exit 0
          echo "Push отклонён (попытка $attempt), подтягиваю изменения из $branch."
          sleep "$attempt"
          git fetch origin "$branch"
          git rebase -X theirs FETCH_HEAD || { git rebase --abort; exit 1; }
        done
        echo "::error title=GitHub City::Не удалось запушить картинки в $branch."
        exit 1
